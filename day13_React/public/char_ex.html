<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 600px;
        }
    </style>
</head>
<body>
    <div>
        <canvas id="myChart"></canvas>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        const ctx = document.getElementById('myChart');
    
        new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
            datasets: [{
                type: 'bar',
                label: 'Bar Dataset',
                data: [10, 20, 30, 40, 80, 190],
                borderWidth: 1
            }, {
                type: 'line',
                label: 'Line Dataset',
                data: [10, 20, 30, 40, 80, 190],
                borderWidth: 1
            }, {
                type: 'radar',
                label: 'Line Dataset',
                data: [10, 20, 30, 40, 80, 190],
                options: {
                    elements: {
                        line: {
                            borderWidth: 1
                        }
                    }
                }
            }]
        },
        options: {
            scales: {
            y: {
                beginAtZero: true
            }
            }
        }
        });
    </script>
</body>
</html>
